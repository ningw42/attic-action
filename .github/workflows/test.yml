name: "Test"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        nix: [nix, lix]
        path-discovery-mode: [store-scan, post-build-hook]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Setup and install dependencies
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # ratchet:pnpm/setup@v2.1.0
        with:
          cache: true

      - name: Build
        run: pnpm run build

      - name: Install Nix
        run: .github/workflows/install-nix.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LIX: ${{ case(matrix.nix == 'lix', '1', '') }}

      - name: Unit and configuration tests
        run: pnpm test

      - name: Setup Attic cache
        uses: ./
        with:
          endpoint: "foo"
          cache: "bar"
          path-discovery-mode: ${{ matrix.path-discovery-mode }}
          __internal-dry-run: true

      - name: Build impure test package
        run: nix build --impure .#impure-test

      - name: Verify hook capture
        if: matrix.path-discovery-mode == 'post-build-hook'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, readdirSync, realpathSync, statSync } from 'node:fs';
          import { dirname, join } from 'node:path';
          const pathsDir = process.env.ATTIC_POST_BUILD_PATHS_DIR;
          assert.ok(pathsDir);
          const paths = readdirSync(pathsDir).filter(name => name.startsWith('paths.'))
            .flatMap(name => readFileSync(join(pathsDir, name), 'utf8').trim().split('\n'));
          assert.ok(paths.includes(realpathSync('result')), 'built output must be captured by the hook');
          assert.equal(statSync(dirname(pathsDir)).mode & 0o777, 0o700);
          assert.equal(statSync(pathsDir).mode & 0o777, 0o700);
          assert.equal(statSync(process.env.ATTIC_POST_BUILD_EVENTS_LOG).mode & 0o777, 0o600);
          NODE
